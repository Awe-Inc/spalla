name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  EMSDK_VERSION: 6.0.13

jobs:
  build:
    name: Core WASM, typecheck, testes e build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Instalar Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Compilar o core em WebAssembly
        run: pnpm build:core

      - name: Typecheck
        run: pnpm typecheck

      - name: Testes
        run: pnpm test

      - name: Build web
        run: pnpm --filter @fretless/web build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: apps/web/dist

  e2e:
    name: E2E (Chromium, as duas suítes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Instalar Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Compilar o core em WebAssembly
        run: pnpm build:core

      - name: Instalar o Chromium do Playwright
        run: pnpm --filter @fretless/web exec playwright install --with-deps chromium

      - name: E2E do app
        run: pnpm --filter @fretless/web test:e2e

      - name: E2E das aulas (API + web)
        run: pnpm --filter @fretless/web test:e2e:aulas

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-relatorios
          path: |
            apps/web/playwright-report
            apps/web/e2e-relatorio
            apps/web/test-results
          retention-days: 7

  deploy:
    name: Publicar no GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
